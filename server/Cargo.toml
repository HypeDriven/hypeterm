[package]
name = "terminal-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
hmac = "0.13.0"
hyper = { version = "1.11.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "server", "server-auto", "service"] }
r2d2 = "0.8.10"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled", "serde_json"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "signal"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
