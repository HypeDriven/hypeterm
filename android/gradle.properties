org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=false
android.nonTransitiveRClass=true

kotlin.code.style=official

# Static OpenSSL for Android, laid out as <root>/<abi>/{include,lib}, produced by
# tools/build-openssl-android.sh. There is no vendored copy: the build fails with a
# pointer to that script if it is missing (see docs/android-build.md). The script's
# own output directory is the default, so nothing needs setting here. Override with
# -Ptm.openssl.root=… or openssl.dir in local.properties, which is not committed.
