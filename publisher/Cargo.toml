[package]
name = "hypeterm-publish"
version = "0.1.0"
edition = "2024"
description = "Publishes a terminal session to a Terminal Mirror Relay"

[dependencies]
# Versions are pinned to the relay's so the dev-dependency cross-check in
# tests/protocol.rs links one copy of each crate rather than two incompatible ones.
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6", features = ["derive", "env"] }
# Raw mode and terminal size, on both a Unix tty and a Windows console.
crossterm = "0.29"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
futures-util = "0.3.34"
portable-pty = "0.9.0"
rand = "0.10.2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "signal", "process", "net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.1", features = ["v4", "serde"] }

# The daemon's local socket, its single-instance lock and its detachment from the
# terminal that started it. All three are POSIX calls with no portable equivalent.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
# The relay itself, so the framing and signing tests compare against the authority
# rather than against a second reading of the specification. Not a build dependency:
# the shipped binary never links it, which matters because it bundles SQLite.
terminal-relay = { path = "../server" }
tempfile = "3.27.0"
